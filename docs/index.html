<!DOCTYPE html>
<html lang="zh-Hant">
  <head>
    <!-- 引入自訂 CSS -->
    <link rel="stylesheet" href="./css/style.css" />

    <meta charset="UTF-8" />
    <title>RailScope 火車查詢系統 - 車站清單</title>

    <!-- Tailwind CDN -->
    <script src="https://cdn.tailwindcss.com"></script>

    <!-- Google Font（讓文字更美） -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@300;400;700&display=swap"
      rel="stylesheet"
    />

    <style>
      body {
        font-family: "Noto Sans TC", sans-serif;
      }
    </style>
  </head>

  <body class="bg-gray-100">
    <!-- Header -->
    <header class="bg-blue-700 text-white py-4 shadow">
      <div class="max-w-6xl mx-auto px-4">
        <h1 class="text-xl font-bold">🚆 RailScope 火車查詢系統</h1>
        <p class="text-sm opacity-80">台灣車站查詢 / 線上資料平台</p>
      </div>
    </header>

    <!-- 主容器 -->
    <main class="max-w-6xl mx-auto px-4 py-8">
      <!-- 查詢區塊卡片 -->
      <div class="bg-white p-6 rounded-lg shadow mb-8">
        <div class="label-row">
          <p class="label-right">出發</p>
          <p class="">抵達</p>
        </div>
        <!-- <h2 class="text-lg font-bold mb-4">📍 車站列表</h2> -->

        <!-- <button
          id="loadBtn"
          class="block px-5 py-2 rounded bg-blue-600 text-white font-medium shadow hover:bg-blue-700 transition"
        >
          載入所有車站
        </button> -->
        <div id="errorBox" class="text-red-600 text-sm hidden"></div>

        <button
          data-city-id="3"
          data-station-id="210"
          id="setOffBtn"
          class="row1Btn mb-4"
        >
          臺北
        </button>

        <button id="roundTripBtn" class="roundTripBtn mb-4">⬌</button>

        <button
          data-city-id="3"
          data-station-id="210"
          id="ArrivalBtn"
          class="row1Btn mb-4"
        >
          臺北
        </button>

        <div id="popup" class="popup hidden">
          <div class="popup-content">
            <button class="close-btn">✕</button>
            <h2>站點查詢表</h2>

            <!-- 兩欄區域 -->
            <div class="popup-body">
              <!-- 左：縣市 -->
              <div class="popup-column">
                <h3>縣市</h3>
                <div id="cityList" class="popup-list"></div>
              </div>

              <!-- 右：車站 -->
              <div class="popup-column">
                <h3>車站</h3>
                <div id="stationList" class="popup-list"></div>
              </div>
            </div>
          </div>
        </div>

        <button id="timeBtn" class="row2-1Btn"></button>

        <button id="timeNowBtn" class="row2-2Btn ml-4">現在</button>

        <button id="timeQueryBtn" class="row3Btn" data-time-type="0">
          出發時間
        </button>

        <button id="vehicleTypeBtn" class="row3Btn ml-4">全部</button>

        <button id="directOrConvertToBtn" class="row3Btn ml-4" data-mode="0">
          直達
        </button>

        <button id="queryBtn" class="row4Btn">查詢</button>
      </div>
      <!-- 查詢結果彈跳視窗 -->
      <div
        id="resultModal"
        class="fixed inset-0 bg-black/40 hidden items-center justify-center z-50"
      >
        <div
          class="bg-white rounded-lg w-full max-w-md max-h-[80vh] flex flex-col overflow-hidden"
        >
          <!-- 上方標題：起訖站 -->
          <div
            id="resultTitle"
            class="px-4 py-3 border-b text-center text-teal-600 font-bold"
          >
            起點 → 終點
          </div>

          <!-- 班次列表 -->
          <div id="resultList" class="flex-1 overflow-y-auto divide-y"></div>
        </div>
      </div>
    </main>

    <!-- Footer -->
    <footer class="mt-10 py-4 text-center text-gray-500 text-sm">
      RailScope 火車查詢系統 · 作品集專案 · 由 Mia 製作
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
    <script src="./js/station.js"></script>
  </body>
</html>
